<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermez Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin: 0 auto;
            max-width: 600px;
            border: 1px solid #ef4444;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { color: #facc15; margin-bottom: 5px; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #334155;
            padding: 10px;
            text-align: center;
        }
        th {
            background: #334155;
            color: #facc15;
        }
        .btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-size: 14px;
        }
        .btn:active { background: #b91c1c; }
    </style>
</head>
<body>

    <div class="card">
        <h2>👑 Hermez Admin Panel</h2>
        <p style="color: #94a3b8; font-size: 13px;">Live tracking of Presale buyers:</p>
        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Package</th>
                        <th>Price</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="buyersTable">
                    <tr>
                        <td colspan="4" style="color: #64748b;">No buyers recorded yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <button class="btn" onclick="clearBuyers()">Clear Buyers List</button>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            loadBuyersTable();
        });

        function loadBuyersTable() {
            let buyers = JSON.parse(localStorage.getItem('hermez_buyers') || '[]');
            const tbody = document.getElementById('buyersTable');
            
            if (buyers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="color: #64748b;">No buyers recorded yet.</td></tr>`;
                return;
            }

            let html = '';
            buyers.forEach(b => {
                html += `<tr>
                    <td style="font-weight: bold; color: #38bdf8;">${b.name}</td>
                    <td>${b.package}</td>
                    <td style="color: #facc15; font-weight: bold;">${b.price}</td>
                    <td style="font-size: 12px; color: #94a3b8;">${b.time}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        function clearBuyers() {
            if(confirm("Are you sure you want to clear the buyers list?")) {
                localStorage.removeItem('hermez_buyers');
                loadBuyersTable();
            }
        }
    </script>
</body>
</html>
