<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermez Airdrop & Presale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { color: #facc15; margin-bottom: 10px; }
        p { font-size: 16px; margin: 8px 0; }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 16px;
        }
        .btn:active { background: #2563eb; }
        .wallet-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
            color: #38bdf8;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <!-- قسم الأيردروب ورصيد المستخدم -->
    <div class="card">
        <h2>Hermez ($HMZ) Airdrop</h2>
        <p>رصيدك الحالي: <span id="balance">0</span> $HMZ</p>
        <p>🎁 المكافأة لكل إحالة: 10 $HMZ</p>
        <p>⚠️ الحد الأدنى للسحب: 500 $HMZ</p>
        
        <div class="wallet-box" id="refLink">t.me/Hermez_bot?start=ref_12345</div>
        <button class="btn" onclick="copyRef()">نسخ رابط الإحالة</button>
        <button class="btn" style="background: #475569;" onclick="requestWithdraw()">طلب السحب (الحد الأدنى 500)</button>
    </div>

    <!-- قسم البيع المسبق Presale -->
    <div class="card" style="border-color: #facc15;">
        <h2>🔥 مرحلة البيع المسبق (Presale)</h2>
        <p>⏳ ينتهي البيع المسبق في: 1 نوفمبر</p>
        
        <div style="background: #0f172a; padding: 12px; border-radius: 8px; margin-top: 15px; border: 1px solid #334155;">
            <p style="font-weight: bold; font-size: 18px;">📦 1,000 HMZ</p>
            <p style="color: #facc15; font-weight: bold;">السعر: 2 TON</p>
            <button class="btn" onclick="buyPackage(1000, 2)">شراء الآن</button>
        </div>

        <div style="background: #0f172a; padding: 12px; border-radius: 8px; margin-top: 15px; border: 1px solid #334155;">
            <p style="font-weight: bold; font-size: 18px;">📦 5,000 HMZ</p>
            <p style="color: #facc15; font-weight: bold;">السعر: 8 TON</p>
            <button class="btn" onclick="buyPackage(5000, 8)">شراء الآن</button>
        </div>

        <div style="background: #0f172a; padding: 12px; border-radius: 8px; margin-top: 15px; border: 1px solid #334155;">
            <p style="font-weight: bold; font-size: 18px;">📦 10,000 HMZ</p>
            <p style="color: #facc15; font-weight: bold;">السعر: 15 TON</p>
            <button class="btn" onclick="buyPackage(10000, 15)">شراء الآن</button>
        </div>
    </div>

    <script>
        // محفظتك الرسمية لاستلام التون عند الشراء
        const OFFICIAL_WALLET = "UQB-Dukz9FM8-Xksu7DdnhFDD1zTzwMZ7ZcMiuOIQFoC78As";

        function copyRef() {
            const refText = document.getElementById("refLink").innerText;
            navigator.clipboard.writeText(refText);
            alert("تم نسخ رابط الإحالة بنجاح!");
        }

        function requestWithdraw() {
            const currentBalance = parseInt(document.getElementById("balance").innerText);
            if (currentBalance < 500) {
                alert("عذراً، يجب أن يصل رصيدك إلى 500 HMZ على الأقل لتتمكن من طلب السحب!");
            } else {
                alert("تم تقديم طلب السحب بنجاح، سيتم المراجعة والتحويل قريباً.");
            }
        }

        function buyPackage(amount, price) {
            if(confirm(`هل تريد تأكيد شراء ${amount} HMZ مقابل ${price} TON؟\nسيتم تحويلك لإتمام الدفع للمحفظة الرسمية.`)) {
                // يمكنك ربط محفظة TonConnect هنا مستقبلاً
                alert(`عنوان المحفظة للتحويل:\n${OFFICIAL_WALLET}\n\nيرجى تحويل ${price} TON واستبدال العملات يدوياً أو عبر النظام.`);
            }
        }
    </script>
</body>
</html>
